<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Agent - Autonomous Meeting Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-emerald: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
        }

        .brand-logo {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
        }

        .stat-card {
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .meeting-card {
            padding: 1.5rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge-status {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-scheduled { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-joining { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-in_progress { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.5); animation: pulse 2s infinite; }
        .badge-completed { background: rgba(99, 102, 241, 0.2); color: #c7d2fe; border: 1px solid rgba(99, 102, 241, 0.4); }
        .badge-failed { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .btn-custom {
            border-radius: 10px;
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-connect {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .btn-connect:hover {
            background: rgba(16, 185, 129, 0.25);
            color: #34d399;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-primary);
        }
        .modal-header, .modal-footer {
            border-color: var(--card-border);
        }
        .form-control, .form-select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            border-radius: 10px;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .dialogue-box {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            max-height: 450px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .speaker-tag {
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-robot fs-3 text-primary"></i>
                <span class="brand-logo">Meeting Agent</span>
            </a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <button class="btn btn-custom btn-connect" onclick="connectBot()">
                    <i class="bi bi-person-check-fill me-1"></i> Connect Bot
                </button>
                <button class="btn btn-custom btn-gradient" data-bs-toggle="modal" data-bs-target="#addMeetingModal">
                    <i class="bi bi-plus-lg me-1"></i> New Meeting
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-4">
        
        <!-- Stat Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="glass-card stat-card">
                    <div class="stat-value text-primary" id="statTotal">0</div>
                    <div class="stat-label">Total Meetings</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card stat-card">
                    <div class="stat-value text-info" id="statScheduled">0</div>
                    <div class="stat-label">Scheduled</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card stat-card">
                    <div class="stat-value text-success" id="statCompleted">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card stat-card">
                    <div class="stat-value text-warning" id="statInProgress">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
            </div>
        </div>

        <!-- Section Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-calendar-event me-2 text-primary"></i>Meetings & Transcripts</h4>
            <button class="btn btn-sm btn-outline-secondary text-light" onclick="fetchMeetings()">
                <i class="bi bi-arrow-clockwise me-1"></i> Refresh
            </button>
        </div>

        <!-- Meetings Grid -->
        <div class="row g-4" id="meetingsGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-secondary mt-2">Loading meetings...</p>
            </div>
        </div>

    </div>

    <!-- Add Meeting Modal -->
    <div class="modal fade" id="addMeetingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-calendar-plus me-2 text-primary"></i>Add New Meeting</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addMeetingForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Meeting Title</label>
                            <input type="text" class="form-control" id="addTitle" placeholder="e.g. Project Sync" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Meeting Link / URL</label>
                            <input type="url" class="form-control" id="addUrl" placeholder="https://meet.google.com/xyz-abc-def" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary small fw-semibold">Platform</label>
                                <select class="form-select" id="addPlatform">
                                    <option value="google_meet">Google Meet</option>
                                    <option value="zoom">Zoom</option>
                                    <option value="teams">Microsoft Teams</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary small fw-semibold">Organizer (Optional)</label>
                                <input type="text" class="form-control" id="addOrganizer" placeholder="e.g. Mahesh">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-4">
                                <label class="form-label text-secondary small fw-semibold">Date</label>
                                <input type="date" class="form-control" id="addDate">
                            </div>
                            <div class="col-4">
                                <label class="form-label text-secondary small fw-semibold">Start Time</label>
                                <input type="time" class="form-control" id="addStartTime">
                            </div>
                            <div class="col-4">
                                <label class="form-label text-secondary small fw-semibold">End Time</label>
                                <input type="time" class="form-control" id="addEndTime">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-custom btn-gradient" onclick="saveMeeting()">Save Meeting</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Meeting Modal -->
    <div class="modal fade" id="editMeetingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-warning"></i>Edit Meeting</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editMeetingForm">
                        <input type="hidden" id="editMeetingId">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Meeting Title</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Meeting Link / URL</label>
                            <input type="url" class="form-control" id="editUrl" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary small fw-semibold">Platform</label>
                                <select class="form-select" id="editPlatform">
                                    <option value="google_meet">Google Meet</option>
                                    <option value="zoom">Zoom</option>
                                    <option value="teams">Microsoft Teams</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary small fw-semibold">Status</label>
                                <select class="form-select" id="editStatus">
                                    <option value="scheduled">Scheduled</option>
                                    <option value="joining">Joining</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="completed">Completed</option>
                                    <option value="failed">Failed</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-4">
                                <label class="form-label text-secondary small fw-semibold">Date</label>
                                <input type="date" class="form-control" id="editDate">
                            </div>
                            <div class="col-4">
                                <label class="form-label text-secondary small fw-semibold">Start Time</label>
                                <input type="time" class="form-control" id="editStartTime">
                            </div>
                            <div class="col-4">
                                <label class="form-label text-secondary small fw-semibold">End Time</label>
                                <input type="time" class="form-control" id="editEndTime">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary text-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning fw-semibold" onclick="updateMeetingSubmit()">Update Meeting</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Transcript Modal -->
    <div class="modal fade" id="transcriptModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="transcriptTitle"><i class="bi bi-chat-quote-fill me-2 text-info"></i>Dialogue Transcript</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="dialogue-box" id="transcriptBody">Loading dialogue script...</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-info text-light" onclick="reformatTranscript()">
                        <i class="bi bi-magic me-1"></i> Identify Names
                    </button>
                    <button type="button" class="btn btn-outline-secondary text-light" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', fetchMeetings);

        async function fetchMeetings() {
            try {
                const res = await fetch('/meetings');
                const meetings = await res.json();
                renderMeetings(meetings);
            } catch (err) {
                console.error(err);
                document.getElementById('meetingsGrid').innerHTML = `
                    <div class="col-12 text-center text-danger py-4">
                        <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                        <p class="mt-2">Failed to load meetings. Ensure database connection is active.</p>
                    </div>
                `;
            }
        }

        function renderMeetings(meetings) {
            const grid = document.getElementById('meetingsGrid');
            if (!meetings || meetings.length === 0) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5 text-secondary">
                        <i class="bi bi-calendar-x fs-1"></i>
                        <p class="mt-2">No meetings found. Add a new meeting to get started!</p>
                    </div>
                `;
                updateStats([]);
                return;
            }

            updateStats(meetings);

            grid.innerHTML = meetings.map(m => {
                const platformIcon = m.platform === 'zoom' ? 'bi-camera-video' : (m.platform === 'teams' ? 'bi-people' : 'bi-google');
                const statusBadge = `<span class="badge-status badge-${m.status}">${m.status.replace('_', ' ')}</span>`;
                
                return `
                    <div class="col-md-6 col-lg-4">
                        <div class="glass-card meeting-card">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="text-secondary small"><i class="bi ${platformIcon} me-1 text-primary"></i> ${m.platform || 'google_meet'}</span>
                                    ${statusBadge}
                                </div>
                                <h5 class="fw-bold mb-1">${escapeHtml(m.title)}</h5>
                                <p class="text-secondary small mb-3">
                                    <i class="bi bi-clock me-1"></i> ${m.meeting_date || 'Today'} ${m.start_time ? '| ' + m.start_time : ''}
                                </p>
                            </div>
                            
                            <div class="pt-3 border-top border-secondary border-opacity-25 mt-3">
                                <div class="d-flex flex-wrap gap-2">
                                    <button class="btn btn-sm btn-gradient flex-grow-1" onclick="triggerBot('${m.id}')">
                                        <i class="bi bi-play-circle me-1"></i> Join Bot
                                    </button>
                                    ${m.transcript ? `
                                        <button class="btn btn-sm btn-outline-info text-light" onclick="viewTranscript('${m.id}', '${escapeHtml(m.title)}')">
                                            <i class="bi bi-chat-text me-1"></i> Transcript
                                        </button>
                                    ` : ''}
                                    <button class="btn btn-sm btn-outline-warning" onclick="openEditModal('${m.id}')">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteMeeting('${m.id}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats(meetings) {
            document.getElementById('statTotal').innerText = meetings.length;
            document.getElementById('statScheduled').innerText = meetings.filter(m => m.status === 'scheduled').length;
            document.getElementById('statCompleted').innerText = meetings.filter(m => m.status === 'completed').length;
            document.getElementById('statInProgress').innerText = meetings.filter(m => m.status === 'in_progress' || m.status === 'joining').length;
        }

        async function connectBot() {
            alert("Launching Chrome browser session for Connect Bot... Please log in if needed.");
            try {
                const res = await fetch('/bot/connect', { method: 'POST' });
                const data = await res.json();
                alert(data.message || "Bot connected successfully!");
            } catch (err) {
                alert("Connect bot request initiated. Check server logs.");
            }
        }

        async function saveMeeting() {
            const data = {
                title: document.getElementById('addTitle').value,
                meeting_url: document.getElementById('addUrl').value,
                platform: document.getElementById('addPlatform').value,
                organizer: document.getElementById('addOrganizer').value || null,
                meeting_date: document.getElementById('addDate').value || null,
                start_time: document.getElementById('addStartTime').value || null,
                end_time: document.getElementById('addEndTime').value || null,
                status: 'scheduled'
            };

            try {
                const res = await fetch('/meetings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addMeetingModal')).hide();
                    document.getElementById('addMeetingForm').reset();
                    fetchMeetings();
                } else {
                    alert('Error saving meeting.');
                }
            } catch (err) {
                alert('Failed to save meeting.');
            }
        }

        async function triggerBot(id) {
            if (!confirm("Are you sure you want Meeting Agent to join this meeting right now?")) return;
            try {
                const res = await fetch(`/meetings/${id}/trigger`, { method: 'POST' });
                const data = await res.json();
                alert("Bot join triggered! Status will update shortly.");
                fetchMeetings();
            } catch (err) {
                alert("Failed to trigger bot.");
            }
        }

        let currentTranscriptMeetingId = null;

        async function viewTranscript(id, title) {
            currentTranscriptMeetingId = id;
            document.getElementById('transcriptTitle').innerHTML = `<i class="bi bi-chat-quote-fill me-2 text-info"></i>Dialogue Transcript: ${title}`;
            document.getElementById('transcriptBody').innerText = "Loading transcript...";
            const modal = new bootstrap.Modal(document.getElementById('transcriptModal'));
            modal.show();

            try {
                const res = await fetch(`/meetings/${id}`);
                const meeting = await res.json();
                document.getElementById('transcriptBody').innerText = meeting.transcript || "No transcript recorded for this meeting yet.";
            } catch (err) {
                document.getElementById('transcriptBody').innerText = "Error loading transcript.";
            }
        }

        async function reformatTranscript() {
            if (!currentTranscriptMeetingId) return;
            const body = document.getElementById('transcriptBody');
            const originalText = body.innerText;
            if (!originalText || originalText.includes("No transcript recorded") || originalText.includes("Loading")) {
                alert("No transcript text available to resolve names.");
                return;
            }
            body.innerText = "✨ Resolving speaker names using Groq AI...";
            try {
                const res = await fetch(`/meetings/${currentTranscriptMeetingId}/reformat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: originalText })
                });
                if (res.ok) {
                    const meeting = await res.json();
                    body.innerText = meeting.transcript;
                    fetchMeetings();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    alert(errData.detail || "Failed to resolve names.");
                    body.innerText = originalText;
                }
            } catch (err) {
                alert("Error re-formatting transcript.");
                body.innerText = originalText;
            }
        }

        async function openEditModal(id) {
            try {
                const res = await fetch(`/meetings/${id}`);
                const m = await res.json();
                document.getElementById('editMeetingId').value = m.id;
                document.getElementById('editTitle').value = m.title || '';
                document.getElementById('editUrl').value = m.meeting_url || '';
                document.getElementById('editPlatform').value = m.platform || 'google_meet';
                document.getElementById('editStatus').value = m.status || 'scheduled';
                document.getElementById('editDate').value = m.meeting_date || '';
                document.getElementById('editStartTime').value = m.start_time || '';
                document.getElementById('editEndTime').value = m.end_time || '';

                new bootstrap.Modal(document.getElementById('editMeetingModal')).show();
            } catch (err) {
                alert('Error loading meeting details.');
            }
        }

        async function updateMeetingSubmit() {
            const id = document.getElementById('editMeetingId').value;
            const data = {
                title: document.getElementById('editTitle').value,
                meeting_url: document.getElementById('editUrl').value,
                platform: document.getElementById('editPlatform').value,
                status: document.getElementById('editStatus').value,
                meeting_date: document.getElementById('editDate').value || null,
                start_time: document.getElementById('editStartTime').value || null,
                end_time: document.getElementById('editEndTime').value || null,
            };

            try {
                const res = await fetch(`/meetings/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('editMeetingModal')).hide();
                    fetchMeetings();
                } else {
                    alert('Failed to update meeting.');
                }
            } catch (err) {
                alert('Failed to update meeting.');
            }
        }

        async function deleteMeeting(id) {
            if (!confirm("Are you sure you want to delete this meeting?")) return;
            try {
                const res = await fetch(`/meetings/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchMeetings();
                } else {
                    alert("Failed to delete meeting.");
                }
            } catch (err) {
                alert("Failed to delete meeting.");
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
