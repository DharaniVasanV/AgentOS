services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vasan5707
      POSTGRES_DB: meeting_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  meeting-agent:
    build: .
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "8000:8000"
    volumes:
      - ./google_session.json:/app/google_session.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
